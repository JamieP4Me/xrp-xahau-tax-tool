name: Build desktop installers

# Builds real, native installers for all three platforms. GitHub Actions
# runs each OS's job on an actual machine of that OS — this is the only
# honest way to produce a signed-shape .dmg and .exe; you cannot
# cross-compile Electron's native modules (better-sqlite3) or macOS/Windows
# packaging metadata from Linux.
#
# Trigger manually from the Actions tab ("Run workflow"), or push a tag
# like "v1.0.1" to build automatically. Nothing is code-signed by default
# (see the comments in the mac/win steps below) — unsigned builds work
# fine for personal/local use, but macOS Gatekeeper and Windows
# SmartScreen will show an "unidentified developer" warning until you add
# real certificates as repo secrets.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact-glob: dist-installers/*.dmg
            artifact-name: macOS-dmg
          - os: windows-latest
            script: dist:win
            artifact-glob: dist-installers/*.exe
            artifact-name: windows-exe
          - os: ubuntu-latest
            script: dist:linux
            artifact-glob: dist-installers/*.AppImage
            artifact-name: linux-appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # A tag of v1.0.1 against a package.json still saying 1.0.0 builds three
      # installers all named 1.0.0 and publishes them under a 1.0.1 release —
      # which is how you end up unable to tell which binary anyone is running.
      # Fail before spending build minutes on it.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG   tag: $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG. Bump the version, commit, then re-tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (db.js, no Electron needed)
        run: npm run test:db

      # electron-builder rebuilds better-sqlite3's native binding against
      # Electron's own ABI as part of `dist`/`pack` automatically, so no
      # separate `npm run rebuild` step is needed here.

      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          # No code-signing identity is configured. To sign macOS builds,
          # add CSC_LINK / CSC_KEY_PASSWORD secrets (a base64 .p12 cert) and
          # they'll be picked up automatically by electron-builder. To sign
          # Windows builds, add CSC_LINK / CSC_KEY_PASSWORD for a code-signing
          # cert the same way. Until then these are unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  # Publish the tagged build as a GitHub Release with the installers attached.
  #
  # Deliberately uses the preinstalled `gh` CLI and the job's built-in token
  # rather than a third-party release action. A marketplace action would be
  # fewer lines, but it runs arbitrary code with write access to this
  # repository on every tag — an unnecessary supply-chain dependency for a
  # project whose whole premise is that it handles financial data carefully.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Filenames contain spaces ("XRP & Xahau Tax Tool-1.0.1-universal.dmg").
          # An earlier version of this step passed them as
          # $(find artifacts -type f | tr '\n' ' '), which word-splits on those
          # spaces and hands gh a list of fragments — "artifacts/windows-exe/XRP",
          # "&", "Xahau"... mapfile reads whole lines into an array instead, and
          # "${FILES[@]}" expands to one argument per element.
          mapfile -t FILES < <(find artifacts -type f | sort)
          printf '  %s\n' "${FILES[@]}"
          cat > notes.md <<'NOTES'
          Offline IRS Form 8949 / Schedule D generator for the XRP Ledger and Xahau.

          ### Before you install

          - **These builds are not signed by a paid developer certificate**, so both
            operating systems will warn you.

            **macOS** — drag the app to Applications, then run this once in Terminal:

            ```
            xattr -dr com.apple.quarantine "/Applications/XRP & Xahau Tax Tool.app"
            ```

            That removes the quarantine flag macOS puts on downloaded files. You can
            also try right-click → **Open** first; if macOS instead claims the app is
            *"damaged"*, it is not — that is what an unnotarised download looks like,
            and the command above is the fix.

            **Windows** — SmartScreen will warn; choose **More info → Run anyway**.

            Proper signing needs a paid Apple Developer account and a Windows code-signing
            certificate.
          - **You need a Dhali Payment-Claim** to fetch anything. The app reads XRPL
            and Xahau history through WinDB and has no other data source. Roughly
            0.000423 XRP per query.
          - **This is not tax advice.** It produces figures for tax forms; it is not
            written by tax professionals and has not been reviewed by any tax
            authority. Have a qualified preparer check the numbers before you file.

          ### What it does and does not see

          It reads on-chain history, builds a FIFO cost-basis ledger wallet by wallet
          (Rev. Proc. 2024-28), classifies addresses as active / lost / gift /
          exchange, and exports Form 8949, Schedule D, Koinly and CoinLedger.

          It cannot see anything that happened *inside* an exchange. If you sold on a
          centralised exchange, this knows the coins left your wallet and nothing
          more — those sales must come from the exchange's own records.

          It never asks for, and cannot use, a private key or seed phrase.
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "${FILES[@]}"
